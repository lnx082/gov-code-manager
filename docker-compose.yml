version: '3.8'

services:
  # 前端服务 (Nginx)
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    ports:
      - "80:80"
    networks:
      - gov-network
    depends_on:
      - bff
    restart: unless-stopped

  # BFF 层服务
  bff:
    build:
      context: ./bff
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DB_TYPE=opengauss
      - DB_HOST=${DB_HOST:-123.60.219.19}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-gov_code_manager}
      - DB_USER=${DB_USER:-dev_admin}
      - DB_PASSWORD=${DB_PASSWORD:-Besti@2026_db}
      - DB_SSL=${DB_SSL:-false}
      - GITEA_URL=${GITEA_URL:-http://123.60.219.19:3000}
      - GITEA_ADMIN_TOKEN=${GITEA_ADMIN_TOKEN:-}
      - JWT_SECRET=${JWT_SECRET:-gov_code_manager_jwt_secret_key_2024_secure}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - AUDIT_LOG_ENABLED=${AUDIT_LOG_ENABLED:-true}
    networks:
      - gov-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  gov-network:
    driver: bridge
